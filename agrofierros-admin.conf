# Subdominio del panel interno: admin.agrofierros.com.ar
# Proxy al container agrofierros-admin (puerto 3098).
server {
    listen 80;
    server_name admin.agrofierros.com.ar;
    return 301 https://admin.agrofierros.com.ar$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.agrofierros.com.ar;

    # El certificado debe cubrir el subdominio (certbot -d admin.agrofierros.com.ar)
    ssl_certificate /etc/letsencrypt/live/agrofierros.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrofierros.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # El optimizador de Next.js va al container
    location /_next/image {
        proxy_pass http://localhost:3098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás al container
    location / {
        proxy_pass http://localhost:3098;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    client_max_body_size 2M;
}
